<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h2>Home</h2>

    <p>Selamat datang di aplikasi!</p>

    <a href="/form">+ Input Data Mahasiswa</a>

    <h3>Data Mahasiswa</h3>

    <table>
        <tr>
            <th>No</th>
            <th>Nama</th>
            <th>NIM</th>
            <th>Jenis Kelamin</th>
        </tr>

        <tr th:each="data, iterStat : ${dataList}">
            <td th:text="${iterStat.index + 1}"></td>
            <td th:text="${data.nama}"></td>
            <td th:text="${data.nim}"></td>
            <td th:text="${data.jenisKelamin}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(dataList)}">
            <td colspan="4">Belum ada data</td>
        </tr>
    </table>

    <br>
    <a href="/">Logout</a>
</div>

</body>
</html>
