<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Aplikasi Mahasiswa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Tambahan style khusus untuk tampilan login */
        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-logo {
            width: 120px; /* Ukuran lebar foto */
            height: 120px; /* Ukuran tinggi foto */
            object-fit: cover;
            border-radius: 50%; /* Membuat foto jadi lingkaran */
            margin-bottom: 15px;
            border: 3px solid #007bff;
        }
        .welcome-text {
            color: #555;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .container-login {
            max-width: 400px; /* Membuat box login lebih ramping */
            margin: 50px auto;
        }
    </style>
</head>
<body>

<div class="container container-login">
    <div class="login-header">
        <img th:src="@{/images/foto-profil.png}" alt="User Photo" class="login-logo">
        
        <h2>Sistem Informasi</h2>
        <p class="welcome-text">
            Selamat datang, <strong>ANTEK ANTEK ASING</strong>!<br>
            Sego liwet lawuh tempe, ndasku mumet ndasmu piye?
        </p>
    </div>

    <form th:action="@{/login}" method="post">
        <label>Username</label>
        <input type="text" name="username" placeholder="Masukkan username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Masukkan password" required>

        <button type="submit" style="width: 100%;">Login</button>
    </form>

    <p class="error" th:if="${error}" th:text="${error}"></p>
</div>

</body>
</html>
