<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* 🔥 FIX RADIO BUTTON */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 15px;
        }

.radio-group label {
    padding: 8px 15px;
    border: 1px solid #ccc;
    border-radius: 20px;
    transition: 0.3s;
}

.radio-group input[type="radio"]:checked + span {
    font-weight: bold;
    color: #007bff;
}
    </style>
</head>
<body>

<div class="container">
    <h2>Form Input Mahasiswa</h2>

    <form th:action="@{/submit}" method="post" th:object="${userData}">

        <label>Nama</label>
        <input type="text" th:field="*{nama}" required>

        <label>NIM</label>
        <input type="text" th:field="*{nim}" required>

        <label>Jenis Kelamin</label>
        <select th:field="*{jenisKelamin}">
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
        </select>

        <button type="submit">Submit</button>
    </form>

    <br>
    <a href="/home">Kembali ke Home</a>
</div>

</body>
</html>
